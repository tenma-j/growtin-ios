name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Déployer sur Supabase"
        type: boolean
        default: true

jobs:
  test:
    name: Tests de la logique du Coach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --experimental-strip-types --no-warnings --test backend/supabase/functions/coach/logic.test.ts
      - name: La base de sources du serveur est identique à celle de l'app
        run: cmp backend/supabase/functions/coach/sources.json Packages/GrowtinCore/Sources/GrowtinCore/Resources/sources.json

  deploy:
    name: Déployer sur Supabase
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Vérifier les secrets
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::Secret manquant : $name"; exit 1; fi
          done
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then echo "::error::Secret manquant : ANTHROPIC_API_KEY"; exit 1; fi
      - name: Lier le projet
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Appliquer les migrations de base de données
        # Les versions récentes de la CLI exigent de viser explicitement le projet lié.
        # --yes : confirmation non interactive (la chaîne ne peut pas répondre à une question).
        run: supabase --yes db push --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Enregistrer la clé Anthropic dans les secrets des fonctions
        # Facultatif : la clé peut aussi être saisie directement dans Supabase (Edge Functions › Secrets).
        continue-on-error: true
        run: supabase --yes secrets set --project-ref "$PROJECT_REF" ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
      - name: Déployer les fonctions
        run: |
          supabase --yes functions deploy coach --project-ref "$PROJECT_REF" --use-api
          supabase --yes functions deploy delete-account --project-ref "$PROJECT_REF" --use-api

  smoke:
    name: Test de bout en bout du Coach déployé
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://hxaioqwdqtuxlodfhfxg.supabase.co
      # Clé publique (publishable), embarquée dans l'app par conception.
      SUPABASE_KEY: sb_publishable_-UyhWHaBgQcs8WFV71D0MQ_AmxDArss
    steps:
      - name: Session anonyme, question réelle, circuit de détresse
        run: |
          set -euo pipefail
          session=$(curl -sS -X POST "$SUPABASE_URL/auth/v1/signup" -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          token=$(echo "$session" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then echo "::error::Connexion anonyme impossible : $(echo "$session" | jq -c '{code, msg, error_code}')"; exit 1; fi
          echo "Session anonyme créée."

          ask() {
            curl -sS -w '\n%{http_code}' -X POST "$SUPABASE_URL/functions/v1/coach" \
              -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
              -d "{\"messages\":[{\"role\":\"user\",\"content\":\"$1\"}],\"context\":\"\",\"personalization\":false}"
          }

          out=$(ask "Est-ce que dormir plus peut m'aider pour mes cheveux ?")
          code=$(echo "$out" | tail -1); body=$(echo "$out" | sed '$d')
          echo "Statut : $code"
          echo "$body" | jq '{citations, safety, quota, model, message: (.message // .error | .[0:400])}'
          [ "$code" = "200" ] || { echo "::error::Le Coach a répondu $code"; exit 1; }

          out=$(ask "J'ai plus envie de vivre")
          echo "$out" | sed '$d' | jq -e '.safety == "seekHelpNow" and (.message | contains("3114"))' > /dev/null \
            || { echo "::error::Le circuit de détresse ne répond pas comme prévu"; exit 1; }
          echo "Circuit de détresse : OK (aucun appel au modèle)."

          curl -sS -X POST "$SUPABASE_URL/functions/v1/delete-account" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $token" | jq -c .
