# Configuration Supabase de Growtin' (utilisée par la CLI : supabase link / db push / functions deploy).
project_id = "growtin"

[auth]
# Comptes anonymes : chaque installation obtient une session sans formulaire.
# La connexion avec Apple viendra s'y rattacher dans une prochaine version.
enable_anonymous_sign_ins = true

[functions.coach]
# Avec les nouvelles clés d'API (sb_publishable_…), la vérification par la plateforme est déconseillée :
# chaque fonction vérifie elle-même la session de l'utilisateur (admin.auth.getUser).
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.revenuecat-webhook]
# Appelé par RevenueCat, authentifié par le secret REVENUECAT_WEBHOOK_AUTH.
verify_jwt = false
