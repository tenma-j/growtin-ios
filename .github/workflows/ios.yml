name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, compilation et captures
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Choisir Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Versions
        run: |
          xcodebuild -version
          swift --version

      - name: Tests du cœur métier (GrowtinCore)
        working-directory: Packages/GrowtinCore
        run: swift test 2>&1 | tee ../../core-tests.log

      - name: Compiler l'app pour le simulateur
        run: |
          set -o pipefail
          xcodebuild build \
            -project Growtin.xcodeproj \
            -scheme Growtin \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Captures d'écran dans le simulateur
        run: scripts/screenshots.sh build/Build/Products/Debug-iphonesimulator/Growtin.app screenshots

      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-ecran
          path: screenshots
          if-no-files-found: ignore

      - name: Publier les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux
          path: |
            xcodebuild.log
            core-tests.log
          if-no-files-found: ignore
