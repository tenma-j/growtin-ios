name: iOS

on:
  push:
    paths-ignore:
      - "backend/**"
      - "docs/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/testflight.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, compilation et captures
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Choisir Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Xcode 26 (SDK iOS 26) est nécessaire pour Liquid Glass.
          xcode-version: "26"

      - name: Versions
        run: |
          xcodebuild -version
          swift --version

      - name: Tests du cœur métier (GrowtinCore)
        working-directory: Packages/GrowtinCore
        run: swift test 2>&1 | tee ../../core-tests.log

      - name: Compiler l'app pour le simulateur
        run: |
          set -o pipefail
          xcodebuild build \
            -project Growtin.xcodeproj \
            -scheme Growtin \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Captures d'écran dans le simulateur
        run: scripts/screenshots.sh build/Build/Products/Debug-iphonesimulator/Growtin.app screenshots

      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: captures-ecran
          path: screenshots
          if-no-files-found: ignore

      - name: Publier les journaux
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: journaux
          path: |
            xcodebuild.log
            core-tests.log
          if-no-files-found: ignore

      - name: Publier les captures sur la branche « captures »
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -e
          mkdir -p /tmp/captures && cp -R screenshots/. /tmp/captures/
          cp xcodebuild.log core-tests.log /tmp/captures/ 2>/dev/null || true
          {
            echo "# Captures d'écran — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "Commit : ${GITHUB_SHA}"
            echo
            for f in $(cd /tmp/captures && ls *.png | sort); do
              echo "### ${f%.png}"
              echo
              echo "<img src=\"$f\" width=\"300\">"
              echo
            done
          } > /tmp/captures/README.md
          cd /tmp/captures
          git init -q -b captures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Captures pour ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" captures
